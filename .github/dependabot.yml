version: 2
updates:

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    groups:
      actions-patch:            # patch bumps arrive together and may auto-merge
        update-types: ["patch"]
    schedule:
      interval: weekly      # check every Monday
      day: monday
      time: "09:00"
      timezone: Europe/Dublin
    labels:
      - dependencies
    commit-message:
      prefix: "ci"

  # ── Go modules ────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /go
    groups:
      go-minor-patch:           # one weekly PR for the safe updates; majors stay separate
        update-types: ["minor", "patch"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Dublin
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  # ── Docker base images (golang / alpine in go/Dockerfile) ─────────────────
  - package-ecosystem: docker
    directory: /go
    groups:
      docker-patch:
        update-types: ["patch"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Dublin
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
