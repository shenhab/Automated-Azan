name: Release

# Every change that reaches main is tested and, if it changes what users run,
# released automatically — no manual tagging:
#
#   test  ->  plan (is this a release? which version?)  ->  tag
#         ->  Docker image + binaries for the tag (in parallel)  ->  GitHub release
#
# The tag is created BEFORE anything is published, so every artifact carries a
# real, existing version. If building or publishing fails, the tag is removed
# again so no half-released version is left behind.
#
# The rules (what counts as a release, how the version is chosen, how to opt out
# or force one) live in go/tools/nextversion and are written up in RELEASING.md.
#
# Why one workflow: a tag pushed by a workflow's own token does not trigger other
# workflows, so tagging and publishing have to happen in the same run.
on:
  push:
    branches: [main]
    tags: ["v*"]          # a tag pushed by hand releases exactly that version
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = decide from the PR label / title)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      force:
        description: "Release even if nothing users run has changed"
        type: boolean
        default: false
      dry_run:
        description: "Only show what would be released; tag and publish nothing"
        type: boolean
        default: false

permissions:
  contents: write        # create the tag and the release
  pull-requests: read    # read the labels of the merged pull request

# One release at a time, so two quick merges cannot be given the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: shenhab/athan

jobs:
  # Nothing is released unless the CI quality gate passes first.
  test:
    name: Test
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/ci.yml

  # ── Decide whether this is a release and which version it gets ────────────
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.version }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0     # all tags and history, to find the last release and the changed files

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BUMP: ${{ inputs.bump || 'auto' }}
          FORCE: ${{ inputs.force || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          # A tag pushed by hand releases exactly that version.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            { echo "release=true"; echo "version=$GITHUB_REF_NAME"; echo "reason=tag pushed by hand"; } >> "$GITHUB_OUTPUT"
            echo "### Release $GITHUB_REF_NAME (tag pushed by hand)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Releases can only be made from main (this run is on $GITHUB_REF). Use dry_run to rehearse from a branch."
            exit 1
          fi

          # What changed: this push, or (by hand) everything since the last release.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            LAST=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            BASE=${LAST:-$(git rev-list --max-parents=0 HEAD | tail -1)}
          else
            BASE="$BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="$GITHUB_SHA^"
            fi
          fi
          git diff --name-only "$BASE" "$GITHUB_SHA" > "$RUNNER_TEMP/files.txt"
          git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/message.txt"
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[].labels[].name] | join(",")' 2>/dev/null || true)
          TAGS=$(git tag --list | paste -sd, -)

          (cd go && go run ./tools/nextversion \
              -tags "$TAGS" -message-file "$RUNNER_TEMP/message.txt" -labels "$LABELS" \
              -files "$RUNNER_TEMP/files.txt" -bump "$BUMP" -force="$FORCE") | tee "$RUNNER_TEMP/decision.txt"

          cat "$RUNNER_TEMP/decision.txt" >> "$GITHUB_OUTPUT"
          RELEASE=$(grep '^release=' "$RUNNER_TEMP/decision.txt" | cut -d= -f2)
          VERSION=$(grep '^version=' "$RUNNER_TEMP/decision.txt" | cut -d= -f2)
          REASON=$(grep '^reason=' "$RUNNER_TEMP/decision.txt" | cut -d= -f2-)
          {
            echo "### Release plan"
            if [ "$RELEASE" = "true" ]; then echo "**Release $VERSION** — $REASON"; else echo "**No release** — $REASON"; fi
            echo
            echo "Labels: \`${LABELS:-none}\` · changed files: $(wc -l < "$RUNNER_TEMP/files.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing will be tagged or published."
            echo "release=false" >> "$GITHUB_OUTPUT"   # the last value wins
          fi

  # ── Create the tag (before anything is published) ─────────────────────────
  tag:
    name: Tag ${{ needs.plan.outputs.tag }}
    needs: [test, plan]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Create and push the tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  # ── Docker image, tagged with the version ─────────────────────────────────
  docker:
    name: Build and push image
    needs: [test, plan, tag]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.plan.outputs.release == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.plan.outputs.tag }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: go
          file: go/Dockerfile
          push: true
          # amd64 only, matching the current deployment. For arm64 (e.g. a Pi)
          # add linux/arm64 and a docker/setup-qemu-action step.
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.plan.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build matrix: each OS builds its own native binary (CGO = real tray) ──
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [plan, tag]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux amd64 ───────────────────────────────────────────────────
          - runner:  ubuntu-latest
            goos:    linux
            goarch:  amd64
            cgo:     "1"
            asset:   azan-agent-linux-amd64

          # ── Linux arm64 (Raspberry Pi 4/5) ───────────────────────────────
          - runner:  ubuntu-latest
            goos:    linux
            goarch:  arm64
            cgo:     "0"          # cross-compile; GTK not available for ARM on ubuntu runner
            asset:   azan-agent-linux-arm64

          # ── Linux arm (Raspberry Pi 3) ────────────────────────────────────
          - runner:  ubuntu-latest
            goos:    linux
            goarch:  arm
            cgo:     "0"
            asset:   azan-agent-linux-arm

          # ── Windows amd64 ─────────────────────────────────────────────────
          - runner:  windows-latest
            goos:    windows
            goarch:  amd64
            cgo:     "1"          # Win32 tray is pure-Go but CGO=1 is safe on Windows
            asset:   azan-agent-windows-amd64.exe

          # ── macOS Intel (cross-compiled from Apple Silicon runner) ──────────
          # macos-13 Intel runners are scarce and slow to pick up jobs.
          # macOS Xcode SDK supports both architectures, so CGO cross-compile
          # works fine from an M-series runner.
          - runner:  macos-latest
            goos:    darwin
            goarch:  amd64
            cgo:     "1"
            asset:   azan-agent-darwin-amd64.dmg

          # ── macOS Apple Silicon ───────────────────────────────────────────
          - runner:  macos-latest
            goos:    darwin
            goarch:  arm64
            cgo:     "1"
            asset:   azan-agent-darwin-arm64.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod   # always matches what go.mod requires
          cache: true
          cache-dependency-path: go/go.sum

      # Linux only: install GTK3 + AppIndicator (tray) + ALSA (local audio via oto)
      - name: Install tray dependencies (Linux)
        if: matrix.goos == 'linux' && matrix.cgo == '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev libasound2-dev

      - name: Build
        working-directory: go
        shell: bash   # force bash on all runners (Git Bash on Windows) so the conditional works
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        # -H windowsgui suppresses the console window on Windows.
        # macOS assets are .dmg (bundle step below); strip suffix for go build -o.
        # -X main.version embeds the release tag into the binary.
        run: |
          EXTRA=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXTRA="-H windowsgui"; fi
          OUT="${{ matrix.asset }}"
          if [ "${{ matrix.goos }}" = "darwin" ]; then OUT="${OUT%.dmg}"; fi
          go build -ldflags="-s -w $EXTRA -X main.version=${{ needs.plan.outputs.tag }}" -o "$OUT" ./cmd/azan-agent

      # macOS only: wrap the binary in a proper .app bundle with icon, then
      # package as a .dmg with a drag-to-Applications shortcut.
      # Uses sips + iconutil (ship with Xcode on macOS runners) for the icon.
      - name: Package as .app + .dmg (macOS)
        if: matrix.goos == 'darwin'
        working-directory: go
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ needs.plan.outputs.tag }}
        run: |
          BINARY="${{ matrix.asset }}"
          BINARY="${BINARY%.dmg}"
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="0.0.0"
          APP="AzanAgent.app"

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BINARY" "$APP/Contents/MacOS/AzanAgent"
          chmod +x "$APP/Contents/MacOS/AzanAgent"

          # Info.plist — inject version into the committed template
          sed "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"

          # Icon: ico → png → iconset → icns
          sips -s format png internal/tray/azan.ico --out /tmp/azan_icon.png 2>/dev/null || true
          mkdir AppIcon.iconset
          for SIZE in 16 32 128 256 512; do
            sips -z $SIZE $SIZE /tmp/azan_icon.png --out "AppIcon.iconset/icon_${SIZE}x${SIZE}.png" 2>/dev/null
            DOUBLE=$((SIZE * 2))
            sips -z $DOUBLE $DOUBLE /tmp/azan_icon.png --out "AppIcon.iconset/icon_${SIZE}x${SIZE}@2x.png" 2>/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf AppIcon.iconset

          # Ad-hoc sign: changes Gatekeeper error from "damaged" (no bypass)
          # to "unverified developer" (Open Anyway in System Settings).
          codesign --sign - --force --deep "$APP" 2>/dev/null || true

          # DMG staging: app + Applications symlink + README + Terminal shortcut
          mkdir dmg_staging
          cp -r "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications

          # README with install steps and the one-time xattr command
          sed "s/__VERSION__/${VERSION}/g" packaging/macos/README.txt \
            > dmg_staging/README.txt

          # Shortcut to Terminal so users can open it straight from the DMG
          # window and paste the xattr command shown in README.txt
          ln -s /System/Applications/Utilities/Terminal.app \
            dmg_staging/Terminal.app

          hdiutil create \
            -volname "Automated Azan ${VERSION}" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            "${{ matrix.asset }}"
          rm -rf dmg_staging "$APP"
          # Keep $BINARY for the self-update artifact upload below.

      # Rename artifacts to include the version tag in the filename.
      # e.g. azan-agent-linux-amd64 → azan-agent-linux-amd64-v1.1.4
      #      azan-agent-darwin-arm64.dmg → azan-agent-darwin-arm64-v1.1.4.dmg
      - name: Add version suffix to artifact names
        id: versioned
        working-directory: go
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          ASSET: ${{ matrix.asset }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          [[ "$ASSET" == *.dmg ]] && EXT=".dmg"
          [[ "$ASSET" == *.exe ]] && EXT=".exe"
          BASE="${ASSET%${EXT}}"
          VERSIONED="${BASE}-${TAG}${EXT}"
          mv "$ASSET" "$VERSIONED"
          echo "asset=${VERSIONED}" >> "$GITHUB_OUTPUT"

          # macOS: also rename the raw binary kept for the self-updater
          if [[ "$GOOS" == "darwin" ]]; then
            RAW="azan-agent-darwin-${GOARCH}"
            RAW_V="${RAW}-${TAG}"
            mv "$RAW" "$RAW_V"
            echo "raw_binary=${RAW_V}" >> "$GITHUB_OUTPUT"
          fi

      # The release itself is created last, by the release job, once every
      # binary and the Docker image have been built.
      - name: Keep the build outputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            go/${{ steps.versioned.outputs.asset }}
            go/${{ steps.versioned.outputs.raw_binary }}
          if-no-files-found: error

  # ── Publish the GitHub release (last, once everything above succeeded) ────
  release:
    name: Publish release
    needs: [plan, docker, build]
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: "Automated Azan ${{ needs.plan.outputs.tag }}"
          files: dist/*
          generate_release_notes: true      # the merged pull requests since the last release
          draft: false
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
          body: |
            ## Automated Azan — ${{ needs.plan.outputs.tag }}

            Cross-platform Go agent. Single binary, no runtime required.

            ### Downloads

            | File | Platform | Tray |
            |---|---|---|
            | `azan-agent-linux-amd64` | Linux x86-64 | ✅ native GTK |
            | `azan-agent-linux-arm64` | Raspberry Pi 4/5 | — headless |
            | `azan-agent-linux-arm` | Raspberry Pi 3 | — headless |
            | `azan-agent-windows-amd64.exe` | Windows 64-bit | ✅ native Win32 |
            | `azan-agent-darwin-amd64.dmg` | macOS Intel | ✅ native NSStatusBar |
            | `azan-agent-darwin-arm64.dmg` | macOS Apple Silicon (M1/M2/M3) | ✅ native NSStatusBar |

            ### Quick start
            1. Download the binary/bundle for your platform
            2. Run it — it installs itself as a background service automatically
            3. Dashboard: `http://localhost:28426`

            ### Docker
            ```
            docker pull shenhab/athan:${{ needs.plan.outputs.tag }}
            ```

            ### macOS — install
            1. Download and open the `.dmg`
            2. Double-click **"Install Automated Azan"** inside the DMG
            3. Look for the icon in your **menu bar** (top-right)

            > **Alternative:** `xattr -rd com.apple.quarantine /Applications/AzanAgent.app`

            ### Windows — first run
            Right-click → **Run as administrator** once to register the Windows Service.

            ### What changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── If anything failed after the tag was created, take it back ────────────
  # (so a failed release leaves no version behind; the next run reuses it).
  # A Docker image already pushed under that version tag is simply overwritten
  # by the retry.
  cleanup:
    name: Remove the tag after a failure
    needs: [plan, tag, docker, build, release]
    if: ${{ always() && needs.tag.result == 'success' && (needs.docker.result != 'success' || needs.build.result != 'success' || needs.release.result != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Delete the release (if any) and the tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          echo "Removed $TAG because the release did not complete." >> "$GITHUB_STEP_SUMMARY"
