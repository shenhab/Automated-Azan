# Run the Go Azan agent in Docker.
#
# The image is built by go/scripts/deploy.sh (it compiles the binary first,
# then packages go/Dockerfile.headless) and published as shenhab/athan.
#
#   docker compose up -d
#
# Web UI: http://<host>:28426
services:
  athan:
    image: shenhab/athan:latest
    container_name: athan
    restart: unless-stopped

    # REQUIRED: Chromecast devices are discovered over mDNS on the local network.
    network_mode: host

    environment:
      - TZ=Europe/Dublin # timezone database ships in the image
      # AZAN_CONFIG_FILE defaults to /config/azan.toml (set in the image)

    volumes:
      # Config: the agent writes a default azan.toml here on first run.
      - azan_config:/config
      # Downloaded timetables and state.
      - azan_data:/root/.local/share/azan-agent

volumes:
  azan_config:
  azan_data:
